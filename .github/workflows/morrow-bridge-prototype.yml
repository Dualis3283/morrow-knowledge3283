name: Morrow Bridge prototype validation
on:
  push:
    branches: ['proposal/morrow-core-v1-spec']
    paths:
      - 'morrow_bridge/**'
      - 'tests/**'
      - '02-KNOWLEDGE/bridge-record-v0.1.schema.json'
      - 'requirements.txt'
      - '.github/workflows/morrow-bridge-prototype.yml'
  pull_request:
    paths:
      - 'morrow_bridge/**'
      - 'tests/**'
      - '02-KNOWLEDGE/bridge-record-v0.1.schema.json'
      - 'requirements.txt'
      - '.github/workflows/morrow-bridge-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Schema, negative and readback tests
        run: python -m unittest discover -s tests -v
      - name: Verify independently staged synthetic destination
        shell: bash
        run: |
          set -euo pipefail
          origin='morrow_bridge/examples/synthetic_decision.json'
          digest="$(sha256sum "$origin" | cut -d' ' -f1)"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          cp "$origin" "$stage/record.json"
          python -m morrow_bridge.readback_gate \
            --workspace "$stage" --destination record.json \
            --expected-sha256 "$digest" \
            --expected-record-id demo.decision.001

name: Deck Lab Android candidate build

on:
  pull_request:
    paths:
      - 'apps/deck-lab/**'
      - '.github/workflows/deck-lab-android-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | head -n 1)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$sdkmanager_bin" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Assemble unsigned-store debug candidate only
        working-directory: apps/deck-lab/android
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Verify packaged engine equals audited source
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/deck-lab/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          packaged="$(unzip -p "$apk" assets/web/engine.mjs | sha256sum | cut -d' ' -f1)"
          source="$(sha256sum apps/deck-lab/web/engine.mjs | cut -d' ' -f1)"
          printf 'packaged=%s\nsource=%s\n' "$packaged" "$source"
          test "$packaged" = "$source"
          for asset in app.mjs styles.css index.html; do
            packaged="$(unzip -p "$apk" "assets/web/$asset" | sha256sum | cut -d' ' -f1)"
            source="$(sha256sum "apps/deck-lab/web/$asset" | cut -d' ' -f1)"
            printf '%s bundled=%s source=%s\n' "$asset" "$packaged" "$source"
            test "$packaged" = "$source"
          done
      - name: Upload short-lived test-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: deck-lab-interaction-candidate-debug
          path: apps/deck-lab/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
